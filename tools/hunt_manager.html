<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunt Manager - Crystal Server</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg2: #16213e;
  --bg3: #0f3460;
  --accent: #e94560;
  --text: #eee;
  --text2: #aaa;
  --green: #4ecca3;
  --yellow: #f0c040;
  --red: #e94560;
  --blue: #4ea8de;
  --orange: #ff9800;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--bg3);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.header h1 { font-size: 18px; font-weight: 600; }
.header .stats { color: var(--text2); font-size: 13px; display: flex; gap: 16px; }
.header .stats span { display: flex; align-items: center; gap: 4px; }
.stat-imported { color: var(--green); }
.stat-skipped { color: var(--text2); }
.stat-review { color: var(--yellow); }
.stat-pending { color: var(--blue); }
.header-actions { margin-left: auto; display: flex; gap: 8px; }

/* Filters */
.filters {
  background: var(--bg2);
  border-bottom: 1px solid var(--bg3);
  padding: 10px 20px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.filters label { color: var(--text2); font-size: 12px; }
.filters input, .filters select {
  background: var(--bg);
  border: 1px solid var(--bg3);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 13px;
}
.filters input:focus, .filters select:focus { outline: none; border-color: var(--accent); }
.filter-group { display: flex; align-items: center; gap: 4px; }
.status-pills { display: flex; gap: 2px; }
.status-pill {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--bg3);
  background: transparent;
  color: var(--text2);
  transition: all 0.15s;
}
.status-pill.active { background: var(--bg3); color: var(--text); border-color: var(--accent); }
.status-pill:hover { border-color: var(--accent); }

/* Layout */
.main { display: flex; flex: 1; overflow: hidden; }
.table-container { flex: 1; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; }
thead { position: sticky; top: 0; z-index: 1; }
thead th {
  background: var(--bg2);
  padding: 8px 10px;
  text-align: left;
  font-size: 12px;
  color: var(--text2);
  border-bottom: 1px solid var(--bg3);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
thead th:hover { color: var(--text); }
tbody tr {
  border-bottom: 1px solid rgba(255,255,255,0.04);
  cursor: pointer;
  transition: background 0.1s;
}
tbody tr:hover { background: rgba(255,255,255,0.04); }
tbody tr.selected { background: rgba(78, 168, 222, 0.12); }
td { padding: 6px 10px; font-size: 13px; white-space: nowrap; }
td.name-col { white-space: normal; max-width: 250px; }

/* Badges */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}
.badge-pending { background: rgba(78,168,222,0.15); color: var(--blue); }
.badge-import { background: rgba(78,204,163,0.15); color: var(--green); }
.badge-skip { background: rgba(255,255,255,0.08); color: var(--text2); }
.badge-review { background: rgba(240,192,64,0.15); color: var(--yellow); }

/* Stars */
.stars { color: var(--yellow); letter-spacing: -1px; }
.stars-empty { color: #333; }

/* Difficulty */
.dif { font-weight: 600; }
.dif-1 { color: var(--green); }
.dif-2 { color: #8bc34a; }
.dif-3 { color: var(--yellow); }
.dif-4 { color: var(--orange); }
.dif-5 { color: var(--red); }

/* Match % bar */
.match-bar { display: inline-flex; align-items: center; gap: 4px; }
.match-bar-bg {
  width: 40px; height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  overflow: hidden;
}
.match-bar-fill { height: 100%; border-radius: 3px; }
.match-100 { background: var(--green); }
.match-75 { background: var(--yellow); }
.match-50 { background: var(--orange); }
.match-0 { background: var(--red); }

/* Detail panel */
.detail-panel {
  width: 400px;
  background: var(--bg2);
  border-left: 1px solid var(--bg3);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.detail-panel.empty { justify-content: center; align-items: center; color: var(--text2); }
.detail-title { font-size: 16px; font-weight: 600; }
.detail-section h3 {
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.detail-field { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
.detail-field .label { color: var(--text2); }
.detail-creatures { display: flex; flex-wrap: wrap; gap: 4px; }
.creature-tag {
  background: rgba(255,255,255,0.06);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
}
.creature-tag.missing { background: rgba(233,69,96,0.15); color: var(--red); text-decoration: line-through; }
.creature-tag.found { background: rgba(78,204,163,0.1); color: var(--green); }
.detail-actions { display: flex; gap: 6px; margin-top: 4px; }

/* Recommendation box */
.recommendation {
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.4;
}
.rec-import { background: rgba(78,204,163,0.1); border: 1px solid rgba(78,204,163,0.3); }
.rec-skip { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); }
.rec-review { background: rgba(240,192,64,0.08); border: 1px solid rgba(240,192,64,0.25); }
.rec-label { font-weight: 600; margin-bottom: 4px; }
.rec-import .rec-label { color: var(--green); }
.rec-skip .rec-label { color: var(--text2); }
.rec-review .rec-label { color: var(--yellow); }
.rec-reasons { color: var(--text2); font-size: 12px; }

/* Skip reason tags */
.skip-reason {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 8px;
  font-size: 10px;
  background: rgba(255,255,255,0.06);
  color: var(--text2);
  margin-left: 4px;
}

/* Buttons */
.btn {
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid var(--bg3);
  background: transparent;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  flex: 1;
  text-align: center;
}
.btn:hover { border-color: var(--accent); }
.btn-import { border-color: var(--green); color: var(--green); }
.btn-import:hover { background: rgba(78,204,163,0.15); }
.btn-skip { border-color: var(--text2); color: var(--text2); }
.btn-skip:hover { background: rgba(255,255,255,0.06); }
.btn-review { border-color: var(--yellow); color: var(--yellow); }
.btn-review:hover { background: rgba(240,192,64,0.15); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn-primary:hover { opacity: 0.85; }
.btn-sm { padding: 4px 10px; font-size: 12px; flex: none; }
.btn-success { background: var(--green); border-color: var(--green); color: #111; }

.coords { font-family: monospace; font-size: 12px; color: var(--blue); }
.wiki-link { color: var(--blue); text-decoration: none; font-size: 12px; }
.wiki-link:hover { text-decoration: underline; }

.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--bg3); color: var(--text);
  padding: 10px 18px; border-radius: 8px; font-size: 13px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
}
.toast.show { opacity: 1; }

.bulk-bar {
  background: var(--bg3); padding: 8px 20px;
  display: flex; gap: 8px; align-items: center;
  font-size: 13px; flex-shrink: 0;
}
.bulk-bar.hidden { display: none; }

/* Loading overlay */
.loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; justify-content: center; align-items: center;
  z-index: 200; font-size: 16px; color: var(--text2);
}
.loading.hidden { display: none; }
</style>
</head>
<body>

<div class="loading" id="loadingOverlay">Loading hunt data from server...</div>

<div class="header">
  <h1>Hunt Manager</h1>
  <div class="stats">
    <span class="stat-pending">Pending: <b id="statPending">0</b></span>
    <span class="stat-imported">Import: <b id="statImport">0</b></span>
    <span class="stat-review">Review: <b id="statReview">0</b></span>
    <span class="stat-skipped">Skip: <b id="statSkip">0</b></span>
    <span>Total: <b id="statTotal">0</b></span>
  </div>
  <div class="header-actions">
    <button class="btn btn-sm" onclick="autoClassify()">Auto-Classify</button>
    <button class="btn btn-sm" onclick="saveStateToServer()">Save State</button>
    <button class="btn btn-sm btn-success" onclick="exportLuaToServer()">Export Lua</button>
  </div>
</div>

<div class="filters">
  <div class="filter-group">
    <label>Search:</label>
    <input type="text" id="filterSearch" placeholder="name, city, creature..." oninput="applyFilters()" style="width:180px">
  </div>
  <div class="filter-group">
    <label>City:</label>
    <select id="filterCity" onchange="applyFilters()"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Level:</label>
    <input type="number" id="filterLvlMin" placeholder="min" style="width:60px" oninput="applyFilters()">
    <span>-</span>
    <input type="number" id="filterLvlMax" placeholder="max" style="width:60px" oninput="applyFilters()">
  </div>
  <div class="filter-group">
    <label>Dif:</label>
    <select id="filterDif" onchange="applyFilters()">
      <option value="">All</option>
      <option value="1">1</option><option value="2">2</option>
      <option value="3">3</option><option value="4">4</option><option value="5">5</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Exp:</label>
    <select id="filterExp" onchange="applyFilters()">
      <option value="">All</option>
      <option value="1">1+</option><option value="2">2+</option>
      <option value="3">3+</option><option value="4">4+</option><option value="5">5</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Match:</label>
    <select id="filterMatch" onchange="applyFilters()">
      <option value="">All</option>
      <option value="100">100%</option><option value="75">75%+</option>
      <option value="50">50%+</option><option value="1">Has creatures</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Status:</label>
    <div class="status-pills">
      <div class="status-pill active" data-status="all" onclick="setStatusFilter(this)">All</div>
      <div class="status-pill" data-status="pending" onclick="setStatusFilter(this)">Pending</div>
      <div class="status-pill" data-status="import" onclick="setStatusFilter(this)">Import</div>
      <div class="status-pill" data-status="review" onclick="setStatusFilter(this)">Review</div>
      <div class="status-pill" data-status="skip" onclick="setStatusFilter(this)">Skip</div>
    </div>
  </div>
</div>

<div class="bulk-bar hidden" id="bulkBar">
  <span id="bulkCount">0 selected</span>
  <button class="btn btn-sm btn-import" onclick="bulkAction('import')">Import</button>
  <button class="btn btn-sm btn-review" onclick="bulkAction('review')">Review</button>
  <button class="btn btn-sm btn-skip" onclick="bulkAction('skip')">Skip</button>
  <button class="btn btn-sm" onclick="clearSelection()">Clear</button>
</div>

<div class="main">
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width:30px"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
          <th data-sort="status" style="width:70px">Status</th>
          <th data-sort="name">Name</th>
          <th data-sort="city">City</th>
          <th data-sort="level" style="width:55px">Lvl</th>
          <th data-sort="difficulty" style="width:40px">Dif</th>
          <th data-sort="expRating" style="width:75px">Exp</th>
          <th data-sort="lootRating" style="width:75px">Loot</th>
          <th data-sort="monsterMatch" style="width:75px">Match</th>
          <th style="width:110px">Coords</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="detail-panel empty" id="detailPanel">
    <span>Select a hunt to view details</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let hunts = [];
let serverMonsters = new Set();
let serverMonstersLower = new Set(); // lowercase lookup for case-insensitive matching
let state = {};
let filtered = [];
let selectedHunt = null;
let selectedRows = new Set();
let sortCol = "name";
let sortDir = 1;
let statusFilter = "all";

// ── Skip reason constants ─────────────────────────────────────────

const SKIP_REASONS = {
  surface: "Surface hunt (z=7) — not underground",
  low_level: "Low level area (< 20)",
  no_coords: "No map coordinates",
  tutorial: "Tutorial / starter area",
  no_creatures: "No creature data from wiki",
  no_monsters_on_server: "No wiki creatures exist on server",
};

const TUTORIAL_CITIES = ["Rookgaard", "Dawnport", "Dawnport Tutorial", "Island of Destiny"];
const TUTORIAL_KEYWORDS = ["tutorial", "rookgaard", "dawnport", "island of destiny"];

// ── Auto-classification ───────────────────────────────────────────

function classifyHunt(h) {
  const reasons = [];
  const coords = h.coords;
  const creatures = h.creatures || [];
  const match = h._monsterMatch;

  // Surface check
  if (coords && coords.z <= 7) {
    reasons.push("surface");
  }

  // No coords
  if (!coords) {
    reasons.push("no_coords");
  }

  // Tutorial areas
  if (TUTORIAL_CITIES.includes(h.city) ||
      TUTORIAL_KEYWORDS.some(k => h.name.toLowerCase().includes(k))) {
    reasons.push("tutorial");
  }

  // Low level
  if (h.level !== null && h.level < 20) {
    reasons.push("low_level");
  }

  // No creatures from wiki
  if (creatures.length === 0) {
    reasons.push("no_creatures");
  }

  // No server monsters match
  if (creatures.length > 0 && match !== undefined && match === 0) {
    reasons.push("no_monsters_on_server");
  }

  // Determine recommendation
  let rec;
  if (reasons.length > 0) {
    // If ONLY issue is surface, still skip but note it's valid
    rec = "skip";
  } else if (coords && creatures.length > 0 && match >= 75 &&
             h.level !== null && h.level >= 100 && (h.expRating || 0) >= 3) {
    rec = "import";
  } else {
    rec = "review";
  }

  return { recommendation: rec, reasons };
}

function autoClassify() {
  let counts = { import: 0, skip: 0, review: 0, kept: 0 };

  hunts.forEach(h => {
    const current = state[h.name];
    // Don't override manually-set statuses
    if (current && current._manual) {
      counts.kept++;
      return;
    }

    const cls = classifyHunt(h);
    if (!state[h.name]) state[h.name] = {};
    state[h.name].status = cls.recommendation;
    state[h.name].skipReasons = cls.reasons;
    state[h.name]._auto = true;
    counts[cls.recommendation]++;
  });

  saveStateLocal();
  applyFilters();
  updateStats();
  toast(`Auto-classified: ${counts.import} import, ${counts.review} review, ${counts.skip} skip` +
        (counts.kept > 0 ? `, ${counts.kept} kept (manual)` : ""));
}

// ── Monster Match Computation ─────────────────────────────────────

// Strip wiki disambiguation suffixes like " (Criatura)", " (Anti-Botter)", etc.
function normalizeCreatureName(name) {
  return name.replace(/\s*\([^)]+\)$/, '');
}

function creatureExistsOnServer(name) {
  const normalized = normalizeCreatureName(name);
  return serverMonsters.has(name) || serverMonsters.has(normalized)
    || serverMonstersLower.has(name.toLowerCase()) || serverMonstersLower.has(normalized.toLowerCase());
}

function computeMonsterMatch(h) {
  const creatures = h.creatures || [];
  if (creatures.length === 0) return undefined;
  const matched = creatures.filter(c => creatureExistsOnServer(c)).length;
  return Math.round((matched / creatures.length) * 100);
}

function enrichHunts() {
  hunts.forEach(h => {
    h._monsterMatch = computeMonsterMatch(h);
    h._classification = classifyHunt(h);
  });
}

// ── Data Loading (auto from server API) ───────────────────────────

async function loadFromServer() {
  try {
    const resp = await fetch("/api/data");
    const data = await resp.json();

    if (data.wikiData && data.wikiData.hunts) {
      hunts = data.wikiData.hunts;
    }
    if (data.serverMonsters) {
      serverMonsters = new Set(data.serverMonsters);
      serverMonstersLower = new Set(data.serverMonsters.map(n => n.toLowerCase()));
    }
    if (data.savedState) {
      state = data.savedState;
    }

    enrichHunts();

    // Auto-classify only the ones without a state yet
    let newCount = 0;
    hunts.forEach(h => {
      if (!state[h.name]) {
        const cls = classifyHunt(h);
        state[h.name] = {
          status: cls.recommendation,
          skipReasons: cls.reasons,
          _auto: true,
        };
        newCount++;
      }
    });

    populateCityFilter();
    applyFilters();
    updateStats();

    document.getElementById("loadingOverlay").classList.add("hidden");

    if (newCount > 0) {
      toast(`Loaded ${hunts.length} hunts, ${serverMonsters.size} server monsters. Auto-classified ${newCount} new.`);
    } else {
      toast(`Loaded ${hunts.length} hunts, ${serverMonsters.size} server monsters. State restored.`);
    }
  } catch (err) {
    document.getElementById("loadingOverlay").textContent =
      "Failed to connect to server. Run: python3 tools/hunt_manager.py";
    console.error(err);
  }
}

function populateCityFilter() {
  const cities = [...new Set(hunts.map(h => h.city).filter(Boolean))].sort();
  const select = document.getElementById("filterCity");
  select.innerHTML = '<option value="">All</option>';
  cities.forEach(c => {
    select.innerHTML += `<option value="${c}">${c}</option>`;
  });
}

// ── State ─────────────────────────────────────────────────────────

function saveStateLocal() {
  // In-memory only; use saveStateToServer for persistence
}

function getStatus(name) {
  return state[name]?.status || "pending";
}

function getSkipReasons(name) {
  return state[name]?.skipReasons || [];
}

function setStatus(name, status, reasons) {
  if (!state[name]) state[name] = {};
  state[name].status = status;
  state[name]._manual = true;
  delete state[name]._auto;
  if (reasons !== undefined) state[name].skipReasons = reasons;
  updateStats();
}

async function saveStateToServer() {
  try {
    const resp = await fetch("/api/save-state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ huntState: state }),
    });
    const result = await resp.json();
    toast(`State saved to ${result.path}`);
  } catch (err) {
    toast("Error saving state: " + err.message);
  }
}

async function exportLuaToServer() {
  const importCount = hunts.filter(h => getStatus(h.name) === "import").length;
  if (importCount === 0) {
    toast("No hunts marked for import");
    return;
  }
  try {
    // Save state first
    await fetch("/api/save-state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ huntState: state }),
    });
    const resp = await fetch("/api/export-lua", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ huntState: state }),
    });
    const result = await resp.json();
    toast(`Exported ${result.count} hunts to ${result.path}`);
  } catch (err) {
    toast("Error exporting: " + err.message);
  }
}

// ── Filtering & Sorting ───────────────────────────────────────────

function applyFilters() {
  const search = document.getElementById("filterSearch").value.toLowerCase();
  const city = document.getElementById("filterCity").value;
  const lvlMin = parseInt(document.getElementById("filterLvlMin").value) || 0;
  const lvlMax = parseInt(document.getElementById("filterLvlMax").value) || 99999;
  const dif = document.getElementById("filterDif").value;
  const exp = document.getElementById("filterExp").value;
  const matchFilter = document.getElementById("filterMatch").value;

  filtered = hunts.filter(h => {
    if (statusFilter !== "all" && getStatus(h.name) !== statusFilter) return false;
    if (city && h.city !== city) return false;
    if (h.level !== null && (h.level < lvlMin || h.level > lvlMax)) return false;
    if (dif && h.difficulty !== parseInt(dif)) return false;
    if (exp && (h.expRating || 0) < parseInt(exp)) return false;
    if (matchFilter) {
      const m = h._monsterMatch;
      if (matchFilter === "1" && (m === undefined || m === 0)) return false;
      if (matchFilter !== "1" && (m === undefined || m < parseInt(matchFilter))) return false;
    }
    if (search) {
      const haystack = [
        h.name, h.city, h.location,
        ...(h.creatures || []),
        ...(h.rareItems || [])
      ].join(" ").toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    let va, vb;
    if (sortCol === "status") {
      const order = { import: 0, review: 1, pending: 2, skip: 3 };
      va = order[getStatus(a.name)] ?? 2;
      vb = order[getStatus(b.name)] ?? 2;
    } else if (sortCol === "monsterMatch") {
      va = a._monsterMatch ?? -1;
      vb = b._monsterMatch ?? -1;
    } else {
      va = a[sortCol];
      vb = b[sortCol];
    }
    if (va == null) va = sortDir > 0 ? Infinity : -Infinity;
    if (vb == null) vb = sortDir > 0 ? Infinity : -Infinity;
    if (typeof va === "string") return va.localeCompare(vb) * sortDir;
    return (va - vb) * sortDir;
  });

  renderTable();
}

function setStatusFilter(el) {
  document.querySelectorAll(".status-pill").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  statusFilter = el.dataset.status;
  applyFilters();
}

// ── Rendering ─────────────────────────────────────────────────────

function renderStars(n) {
  if (!n) return '<span class="stars-empty">-----</span>';
  return '<span class="stars">' + "\u2605".repeat(n) + '</span>' +
         '<span class="stars-empty">' + "\u2605".repeat(5 - n) + '</span>';
}

function renderMatchBadge(pct) {
  if (pct === undefined) return '<span style="color:#555">-</span>';
  const cls = pct === 100 ? "match-100" : pct >= 75 ? "match-75" : pct >= 50 ? "match-50" : "match-0";
  return `<span class="match-bar">
    <span class="match-bar-bg"><span class="match-bar-fill ${cls}" style="width:${pct}%"></span></span>
    <span style="font-size:11px;color:${pct === 100 ? 'var(--green)' : pct >= 75 ? 'var(--yellow)' : pct >= 50 ? 'var(--orange)' : 'var(--red)'}">${pct}%</span>
  </span>`;
}

function esc(name) { return name.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function renderTable() {
  const tbody = document.getElementById("tableBody");
  const html = filtered.map(h => {
    const st = getStatus(h.name);
    const badgeClass = st === "import" ? "badge-import" : st === "skip" ? "badge-skip" :
                       st === "review" ? "badge-review" : "badge-pending";
    const checked = selectedRows.has(h.name) ? "checked" : "";
    const sel = selectedHunt === h.name ? "selected" : "";
    const coords = h.coords ? `${h.coords.x},${h.coords.y},${h.coords.z}` : "-";
    const difClass = h.difficulty ? `dif dif-${h.difficulty}` : "";
    const reasons = getSkipReasons(h.name);
    const reasonTags = st === "skip" && reasons.length > 0
      ? reasons.map(r => `<span class="skip-reason">${r}</span>`).join("")
      : "";

    return `<tr class="${sel}" onclick="selectHunt('${esc(h.name)}')">
      <td><input type="checkbox" ${checked} onclick="event.stopPropagation(); toggleRow('${esc(h.name)}')" ></td>
      <td><span class="badge ${badgeClass}">${st}</span>${reasonTags}</td>
      <td class="name-col">${h.name}</td>
      <td>${h.city || "-"}</td>
      <td>${h.level || "-"}</td>
      <td><span class="${difClass}">${h.difficulty || "-"}</span></td>
      <td>${renderStars(h.expRating)}</td>
      <td>${renderStars(h.lootRating)}</td>
      <td>${renderMatchBadge(h._monsterMatch)}</td>
      <td class="coords">${coords}</td>
    </tr>`;
  }).join("");
  tbody.innerHTML = html;
  updateBulkBar();
}

// ── Selection ─────────────────────────────────────────────────────

function selectHunt(name) {
  selectedHunt = name;
  renderTable();
  renderDetail(name);
}

function toggleRow(name) {
  if (selectedRows.has(name)) selectedRows.delete(name);
  else selectedRows.add(name);
  updateBulkBar();
}

function toggleSelectAll(cb) {
  if (cb.checked) filtered.forEach(h => selectedRows.add(h.name));
  else selectedRows.clear();
  renderTable();
}

function clearSelection() {
  selectedRows.clear();
  document.getElementById("selectAll").checked = false;
  renderTable();
}

function updateBulkBar() {
  const bar = document.getElementById("bulkBar");
  const count = selectedRows.size;
  if (count > 0) {
    bar.classList.remove("hidden");
    document.getElementById("bulkCount").textContent = `${count} selected`;
  } else {
    bar.classList.add("hidden");
  }
}

function bulkAction(status) {
  selectedRows.forEach(name => setStatus(name, status));
  selectedRows.clear();
  document.getElementById("selectAll").checked = false;
  applyFilters();
  toast(`Bulk updated to "${status}"`);
}

// ── Detail Panel ──────────────────────────────────────────────────

function renderDetail(name) {
  const panel = document.getElementById("detailPanel");
  const h = hunts.find(x => x.name === name);
  if (!h) {
    panel.className = "detail-panel empty";
    panel.innerHTML = "<span>Select a hunt to view details</span>";
    return;
  }

  const st = getStatus(name);
  const coords = h.coords ? `${h.coords.x}, ${h.coords.y}, ${h.coords.z}` : "N/A";
  const cls = h._classification || classifyHunt(h);

  // Creatures with server validation
  const creatures = (h.creatures || []).map(c => {
    const exists = creatureExistsOnServer(c);
    return `<span class="creature-tag ${exists ? 'found' : 'missing'}">${c}</span>`;
  }).join("") || "<span style='color:var(--text2)'>No creature data</span>";

  const rares = (h.rareItems || []).map(r =>
    `<span class="creature-tag">${r}</span>`
  ).join("") || "-";

  const flags = (h.infoFlags || []).map(f =>
    `<span class="creature-tag">${f}</span>`
  ).join("") || "-";

  // Recommendation box
  const recClass = cls.recommendation === "import" ? "rec-import" :
                   cls.recommendation === "skip" ? "rec-skip" : "rec-review";
  const recLabel = cls.recommendation === "import" ? "Recommended: Import" :
                   cls.recommendation === "skip" ? "Recommended: Skip" : "Recommended: Review";
  let recReasons = "";
  if (cls.reasons.length > 0) {
    recReasons = cls.reasons.map(r => SKIP_REASONS[r] || r).join("<br>");
  } else if (cls.recommendation === "import") {
    const parts = [];
    if (h._monsterMatch === 100) parts.push("All creatures exist on server");
    else if (h._monsterMatch >= 75) parts.push(`${h._monsterMatch}% creatures match server`);
    if (h.coords && h.coords.z > 7) parts.push("Underground location (z=" + h.coords.z + ")");
    if (h.level >= 100) parts.push("Level " + h.level + "+");
    if (h.expRating >= 3) parts.push("Good exp rating");
    recReasons = parts.join("<br>") || "Meets all import criteria";
  } else {
    recReasons = "Does not meet auto-import criteria — manual review suggested";
  }

  // Match summary
  const matchedCount = (h.creatures || []).filter(c => creatureExistsOnServer(c)).length;
  const totalCount = (h.creatures || []).length;
  const matchStr = totalCount > 0
    ? `${matchedCount}/${totalCount} (${h._monsterMatch}%)`
    : "No creature data";
  const matchColor = h._monsterMatch === 100 ? "var(--green)" :
                     h._monsterMatch >= 75 ? "var(--yellow)" :
                     h._monsterMatch >= 50 ? "var(--orange)" : "var(--red)";

  panel.className = "detail-panel";
  panel.innerHTML = `
    <div>
      <div class="detail-title">${h.name}</div>
      <a href="${h.wikiUrl}" target="_blank" class="wiki-link">Open in TibiaWiki &rarr;</a>
    </div>

    <div class="recommendation ${recClass}">
      <div class="rec-label">${recLabel}</div>
      <div class="rec-reasons">${recReasons}</div>
    </div>

    <div class="detail-actions">
      <button class="btn btn-import ${st === 'import' ? 'btn-primary' : ''}" onclick="setStatusAndRefresh('${esc(name)}', 'import')">Import</button>
      <button class="btn btn-review ${st === 'review' ? 'btn-primary' : ''}" onclick="setStatusAndRefresh('${esc(name)}', 'review')">Review</button>
      <button class="btn btn-skip ${st === 'skip' ? 'btn-primary' : ''}" onclick="setStatusAndRefresh('${esc(name)}', 'skip')">Skip</button>
    </div>

    <div class="detail-section">
      <h3>Info</h3>
      <div class="detail-field"><span class="label">City</span><span>${h.city || "-"}</span></div>
      <div class="detail-field"><span class="label">Location</span><span style="text-align:right;max-width:220px">${h.location || "-"}</span></div>
      <div class="detail-field"><span class="label">Level</span><span>${h.level ? h.level + "+" : "-"}</span></div>
      <div class="detail-field"><span class="label">Difficulty</span><span>${h.difficulty ? "\u2605".repeat(h.difficulty) : "-"}</span></div>
      <div class="detail-field"><span class="label">Exp Rating</span><span>${renderStars(h.expRating)}</span></div>
      <div class="detail-field"><span class="label">Loot Rating</span><span>${renderStars(h.lootRating)}</span></div>
      <div class="detail-field"><span class="label">Premium</span><span>${h.premium ? "Yes" : "No"}</span></div>
      <div class="detail-field"><span class="label">Vocation</span><span>${h.vocation || "-"}</span></div>
      <div class="detail-field"><span class="label">Version</span><span>${h.implemented || "-"}</span></div>
    </div>

    <div class="detail-section">
      <h3>Coordinates</h3>
      <div class="coords" style="font-size:14px">${coords}</div>
      ${h.coords && h.coords.z <= 7 ? '<div style="color:var(--orange);font-size:12px;margin-top:4px">Surface location (z=' + h.coords.z + ')</div>' : ''}
    </div>

    <div class="detail-section">
      <h3>Server Monster Match — <span style="color:${totalCount > 0 ? matchColor : 'var(--text2)'}">${matchStr}</span></h3>
      <div class="detail-creatures">${creatures}</div>
      <div style="font-size:11px;color:var(--text2);margin-top:6px">
        <span class="creature-tag found" style="font-size:10px">green</span> = exists on server &nbsp;
        <span class="creature-tag missing" style="font-size:10px">red</span> = missing
      </div>
    </div>

    <div class="detail-section">
      <h3>Rare Items</h3>
      <div class="detail-creatures">${rares}</div>
    </div>

    <div class="detail-section">
      <h3>Facilities</h3>
      <div class="detail-creatures">${flags}</div>
    </div>

    <div class="detail-section">
      <h3>Notes</h3>
      <textarea style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--bg3);border-radius:4px;padding:6px;font-size:13px;resize:vertical;min-height:60px"
        placeholder="Add notes..."
        onchange="saveNotes('${esc(name)}', this.value)"
      >${state[name]?.notes || ""}</textarea>
    </div>
  `;
}

function setStatusAndRefresh(name, status) {
  // If skipping, carry over auto reasons; if importing/reviewing, clear them
  const reasons = status === "skip" ? (state[name]?.skipReasons || []) : [];
  setStatus(name, status, reasons);
  applyFilters();
  renderDetail(name);
}

function saveNotes(name, notes) {
  if (!state[name]) state[name] = { status: "pending" };
  state[name].notes = notes;
}

// ── Stats ─────────────────────────────────────────────────────────

function updateStats() {
  let counts = { pending: 0, import: 0, skip: 0, review: 0 };
  hunts.forEach(h => { counts[getStatus(h.name)] = (counts[getStatus(h.name)] || 0) + 1; });
  document.getElementById("statPending").textContent = counts.pending;
  document.getElementById("statImport").textContent = counts.import;
  document.getElementById("statSkip").textContent = counts.skip;
  document.getElementById("statReview").textContent = counts.review;
  document.getElementById("statTotal").textContent = hunts.length;
}

// ── Sorting ───────────────────────────────────────────────────────

document.querySelectorAll("thead th[data-sort]").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.sort;
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }
    applyFilters();
  });
});

// ── Toast ─────────────────────────────────────────────────────────

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3000);
}

// ── Keyboard shortcuts ────────────────────────────────────────────

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  if (!selectedHunt) return;

  if (e.key === "i") setStatusAndRefresh(selectedHunt, "import");
  if (e.key === "s") setStatusAndRefresh(selectedHunt, "skip");
  if (e.key === "r") setStatusAndRefresh(selectedHunt, "review");
  if (e.key === "ArrowDown" || e.key === "j") {
    e.preventDefault();
    const idx = filtered.findIndex(h => h.name === selectedHunt);
    if (idx < filtered.length - 1) selectHunt(filtered[idx + 1].name);
  }
  if (e.key === "ArrowUp" || e.key === "k") {
    e.preventDefault();
    const idx = filtered.findIndex(h => h.name === selectedHunt);
    if (idx > 0) selectHunt(filtered[idx - 1].name);
  }
});

// ── Init ──────────────────────────────────────────────────────────

loadFromServer();
</script>
</body>
</html>
